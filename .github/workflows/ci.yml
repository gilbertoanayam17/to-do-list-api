name: CI

# Corre las pruebas en cada PR hacia main. La regla de main exige que el check "tests" pase
# para poder hacer merge. Release también lo usa antes de publicar.
on:
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # la misma que trae Ubuntu 24.04 en la EC2

      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -v
