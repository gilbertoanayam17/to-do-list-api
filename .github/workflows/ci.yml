name: CI

# Continuous Integration: corre las pruebas en cada PR hacia main.
# Para que bloquee el merge si fallan, la regla de la rama main debe exigir el check "tests".
on:
  pull_request:
    branches: [main]
  workflow_call: # Release lo reutiliza antes de publicar

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Misma versión de Python que trae Ubuntu 24.04 en la EC2.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-dev.txt

      - run: pytest -v
