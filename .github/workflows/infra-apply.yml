name: Infra - apply

# Se dispara a mano: Actions > Infra - apply > Run workflow
on:
  workflow_dispatch:

# Un solo apply/destroy a la vez sobre el mismo tfstate.
concurrency:
  group: terraform
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Credenciales del Learner Lab (AWS Details). Cambian con cada sandbox nuevo.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.13.0"
          terraform_wrapper: false

      # use_lockfile: Terraform pone un .tflock en S3 mientras trabaja (requiere >= 1.10).
      - name: terraform init (backend S3)
        run: bash scripts/tf-init.sh -backend-config=use_lockfile=true

      - name: terraform plan
        run: terraform -chdir=terraform plan -input=false -out=tfplan

      - name: terraform apply
        run: terraform -chdir=terraform apply -input=false tfplan

      - name: Resumen
        run: |
          IP=$(terraform -chdir=terraform output -raw server_public_ip)
          URL=$(terraform -chdir=terraform output -raw api_url)
          {
            echo "## Infraestructura lista"
            echo ""
            echo "- IP de la EC2: \`$IP\`"
            echo "- API: $URL (tarda 1-2 min en responder tras el boot)"
            echo ""
            echo "Actualiza el secret **EC2_HOST** con \`$IP\` para que el deploy funcione."
          } >> "$GITHUB_STEP_SUMMARY"
