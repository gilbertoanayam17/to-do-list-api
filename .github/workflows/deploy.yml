name: Deploy

# Continuous Deployment: la EC2 descarga el zip del release y reinicia la app con esa versión.
# Lo llama Release al publicar un tag; también se puede correr a mano con un tag existente.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag del release a desplegar (ej. v1.0.0)"
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
      EC2_HOST: ${{ secrets.EC2_HOST }}
      ZIP_URL: https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}/to-do-list-api-${{ inputs.tag }}.zip
    steps:
      - name: Llave SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/ec2
          chmod 600 ~/.ssh/ec2

      - name: Descargar el release en la EC2 y reiniciar
        run: |
          # shellcheck disable=SC2087 # $TAG y $ZIP_URL se sustituyen aquí, antes de mandarlos a la EC2
          ssh -i ~/.ssh/ec2 -o StrictHostKeyChecking=no "ubuntu@$EC2_HOST" <<EOF
            set -e
            cd /tmp
            rm -rf release.zip to-do-list-api
            curl -fsSL -o release.zip $ZIP_URL
            unzip -q release.zip
            rm -rf /opt/todo/app
            mv to-do-list-api /opt/todo/app
            /opt/todo/venv/bin/pip install -q -r /opt/todo/app/requirements.txt
            echo "APP_VERSION=$TAG" | sudo tee /etc/todo.env
            sudo systemctl restart todo
          EOF

      - name: Confirmar la versión con GET /version
        run: curl -fsS --retry 5 --retry-connrefused --retry-delay 2 "http://$EC2_HOST:8000/version" | grep "$TAG"
