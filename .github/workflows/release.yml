name: Release

# Continuous Delivery: al empujar un tag v#.#.# corre las pruebas, crea un release con el
# repo en zip y después manda a desplegarlo.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # para crear el release
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Comprimir el repo
        run: git archive --format=zip --prefix=to-do-list-api/ -o "to-do-list-api-$TAG.zip" HEAD

      - name: Crear el release
        run: gh release create "$TAG" "to-do-list-api-$TAG.zip" --title "$TAG" --generate-notes

  # Un release creado con GITHUB_TOKEN no dispara workflows con "on: release",
  # así que el deploy se llama aquí cuando el release ya está publicado.
  deploy:
    needs: release
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
